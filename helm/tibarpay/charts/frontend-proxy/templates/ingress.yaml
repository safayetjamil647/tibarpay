---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tibarpay-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: tibarpay.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-proxy
            port:
              number: 80
